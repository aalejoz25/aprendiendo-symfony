services:
  mysql57:
    image: mysql:5.7
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: aprendiendo-sf4
    ports:
      - "3306:3306"
    volumes:
      - mysql57_data:/var/lib/mysql

  php74:
    build:
      context: .
      dockerfile: .docker/php74/Dockerfile
    working_dir: /app
    volumes:
      - .:/app:Z
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      COMPOSER_HOME: /tmp/composer
    ports:
      - "8000:8000"

volumes:
  mysql57_data:
